<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>肌肉碧 · 动作预览</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111827; color: #e7eef7; font-family: system-ui, sans-serif; }
      header { padding: 28px 32px 20px; border-bottom: 1px solid #344254; background: #182334; }
      h1 { margin: 0 0 10px; font-size: 28px; } p { margin: 0 0 16px; color: #b6c7d9; }
      nav { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
      button, select, a { background: #27394d; color: white; border: 1px solid #597086; border-radius: 6px; padding: 8px 12px; font: inherit; text-decoration: none; cursor: pointer; }
      button:hover, a:hover { background: #3c5069; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; padding: 24px 32px; }
      article { background: #1d2b3e; border: 1px solid #425269; border-radius: 12px; overflow: hidden; }
      canvas { width: 100%; display: block; }
      h2 { margin: 12px 16px 4px; font-size: 18px; } article p { font-size: 14px; margin: 0 16px 16px; }
      #status { padding: 10px 32px; color: #ffd27c; }
    </style>
  </head>
  <body>
    <header>
      <h1>肌肉碧 · 全动作预览</h1>
      <p>逐个检查出拳、抓取、受击与庆祝动作。横线标出统一脚底位置。</p>
      <nav>
        <button id="pause" type="button">暂停</button>
        <button id="replay" type="button">全部重播</button>
        <button id="mirror" type="button">面向左</button>
        <label>速度 <select id="speed"><option value="0.5">0.5 ×</option><option value="1" selected>1 ×</option><option value="1.5">1.5 ×</option></select></label>
        <a href="/">进入游戏</a>
      </nav>
    </header>
    <div id="status" role="status">正在加载动作素材…</div>
    <main id="gallery"></main>
    <script type="module" src="/src/animations-preview.js"></script>
  </body>
</html>
